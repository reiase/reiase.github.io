<svg xmlns="http://www.w3.org/2000/svg" width="460" height="830" viewBox="0 0 460 830" role="img" aria-labelledby="title desc"><title id="title">文件修改怎样对任务可见</title><desc id="desc">lower 保留原文件，upper 保存修改和删除标记，merged 合成 Agent 的目录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617186"/></marker></defs>
