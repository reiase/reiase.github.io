<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IVF tree selects semantic rows and OPQ PQ columns select precision in a storage matrix">
  <style>
    .title{font:700 20px sans-serif;fill:#172033}.label{font:700 14px sans-serif;fill:#172033}.small{font:12px sans-serif;fill:#334155}.tiny{font:11px sans-serif;fill:#475569}
    .tree{fill:#ecfeff;stroke:#0891b2;stroke-width:1.6}.matrix{fill:#fff;stroke:#334155;stroke-width:1.8}.policy{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.5}
    .node{fill:#fff;stroke:#64748b;stroke-width:1.2}.hotnode{fill:#e0f2fe;stroke:#0891b2;stroke-width:1.8}.query{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
    .cell{fill:#fff;stroke:#cbd5e1;stroke-width:1}.core{fill:#dcfce7;stroke:#16a34a;stroke-width:1.4}.ref1{fill:#fef3c7;stroke:#d97706;stroke-width:1.4}.ref2{fill:#fee2e2;stroke:#dc2626;stroke-width:1.4}.payload{fill:#f8fafc;stroke:#94a3b8;stroke-width:1}.rowbg{fill:#e0f2fe;stroke:#0891b2;stroke-width:1.2;opacity:.45}
    .edge{stroke:#64748b;stroke-width:1.3;fill:none}.hotedge{stroke:#0891b2;stroke-width:2.5;fill:none}.arrow{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.4;fill:none;stroke-dasharray:5 5;marker-end:url(#arrow)}.colmark{stroke:#ea580c;stroke-width:5;fill:none;stroke-linecap:round}.window{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:7 5}.brace{stroke:#0891b2;stroke-width:3;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/></marker></defs>
  <rect width="1120" height="660" fill="#fff"/>
  <text x="30" y="38" class="title">Future work: IVF selects semantic rows; OPQ/PQ selects precision columns</text>

  <rect x="40" y="78" width="300" height="520" rx="18" class="tree"/>
  <text x="70" y="112" class="label">IVF flow: semantic row selection</text>
  <text x="70" y="136" class="small">query scans centroids, then selects nearby partitions</text>

  <rect x="66" y="278" width="82" height="46" rx="12" class="query"/>
  <text x="86" y="306" class="tiny">query</text>
  <path d="M148 301 C166 301,170 301,188 301" class="arrow"/>

  <text x="170" y="188" class="tiny">coarse centroids</text>
  <circle cx="206" cy="232" r="24" class="node"/><text x="191" y="237" class="tiny">C0</text>
  <circle cx="206" cy="302" r="24" class="hotnode"/><text x="191" y="307" class="tiny">C1</text>
  <circle cx="206" cy="372" r="24" class="node"/><text x="191" y="377" class="tiny">C2</text>
  <path d="M188 301 C184 256,188 238,182 232" class="edge"/>
  <path d="M188 301 C194 301,198 302,206 302" class="hotedge"/>
  <path d="M188 301 C184 346,188 366,182 372" class="edge"/>

  <text x="258" y="188" class="tiny">IVF partitions</text>
  <rect x="260" y="218" width="58" height="32" rx="8" class="node"/><text x="274" y="239" class="tiny">P41</text>
  <rect x="260" y="266" width="58" height="32" rx="8" class="hotnode"/><text x="274" y="287" class="tiny">P42</text>
  <rect x="260" y="314" width="58" height="32" rx="8" class="hotnode"/><text x="274" y="335" class="tiny">P43</text>
  <rect x="260" y="362" width="58" height="32" rx="8" class="node"/><text x="274" y="383" class="tiny">P44</text>
  <path d="M230 302 C246 258,248 238,260 234" class="edge"/>
  <path d="M230 302 C244 284,248 282,260 282" class="hotedge"/>
  <path d="M230 302 C244 320,248 330,260 330" class="hotedge"/>
  <path d="M230 302 C246 346,248 374,260 378" class="edge"/>

  <path d="M330 266 C350 284,350 330,330 346" class="brace"/>
  <text x="164" y="456" class="small">selected row band: P42-P43</text>
  <text x="124" y="482" class="tiny">IVF provides semantic locality across matrix rows</text>

  <rect x="356" y="78" width="724" height="520" rx="18" class="matrix"/>
  <text x="394" y="112" class="label">Complete PQ storage matrix</text>
  <text x="394" y="136" class="small">Rows are IVF partitions. Columns are OPQ/PQ precision slices and optional payload.</text>

  <text x="488" y="184" class="tiny">L0 core</text>
  <text x="620" y="184" class="tiny">L1 refine</text>
  <text x="756" y="184" class="tiny">L2 full</text>
  <text x="888" y="184" class="tiny">payload / vectors</text>

  <text x="396" y="228" class="tiny">P40</text>
  <rect x="466" y="206" width="112" height="38" rx="5" class="cell"/><rect x="598" y="206" width="112" height="38" rx="5" class="cell"/><rect x="730" y="206" width="112" height="38" rx="5" class="cell"/><rect x="862" y="206" width="174" height="38" rx="5" class="payload"/>

  <text x="396" y="282" class="tiny">P41</text>
  <rect x="466" y="260" width="112" height="38" rx="5" class="cell"/><rect x="598" y="260" width="112" height="38" rx="5" class="cell"/><rect x="730" y="260" width="112" height="38" rx="5" class="cell"/><rect x="862" y="260" width="174" height="38" rx="5" class="payload"/>

  <rect x="382" y="314" width="668" height="108" rx="12" class="rowbg"/>
  <text x="396" y="342" class="tiny">P42</text>
  <rect x="466" y="320" width="112" height="38" rx="5" class="core"/><rect x="598" y="320" width="112" height="38" rx="5" class="ref1"/><rect x="730" y="320" width="112" height="38" rx="5" class="ref2"/><rect x="862" y="320" width="174" height="38" rx="5" class="payload"/>
  <text x="396" y="396" class="tiny">P43</text>
  <rect x="466" y="374" width="112" height="38" rx="5" class="core"/><rect x="598" y="374" width="112" height="38" rx="5" class="ref1"/><rect x="730" y="374" width="112" height="38" rx="5" class="ref2"/><rect x="862" y="374" width="174" height="38" rx="5" class="payload"/>

  <text x="396" y="456" class="tiny">P44</text>
  <rect x="466" y="434" width="112" height="38" rx="5" class="cell"/><rect x="598" y="434" width="112" height="38" rx="5" class="cell"/><rect x="730" y="434" width="112" height="38" rx="5" class="cell"/><rect x="862" y="434" width="174" height="38" rx="5" class="payload"/>

  <path d="M518 196 L518 430" class="colmark"/>
  <path d="M650 196 L650 430" class="colmark"/>
  <text x="588" y="510" class="tiny">OPQ/PQ column locality: easy queries read L0; harder queries add L1/L2</text>

  <rect x="458" y="314" width="260" height="108" rx="10" class="window"/>
  <text x="742" y="526" class="tiny">purple window = selected IVF rows x selected precision columns</text>

  <rect x="894" y="494" width="144" height="74" rx="14" class="policy"/>
  <text x="928" y="522" class="label">Policy</text>
  <text x="914" y="544" class="tiny">margin weak: add columns</text>
  <text x="914" y="562" class="tiny">risk high: fetch payload</text>

  <path d="M318 306 C342 314,352 344,382 366" class="arrow"/>
  <path d="M966 494 C910 462,800 438,718 422" class="dash"/>

  <text x="128" y="636" class="small">IVF is the row-locality mechanism: a query flows left-to-right from centroids to a small semantic row band. OPQ/PQ is the column-locality mechanism: the same rows can be read at increasing precision.</text>
</svg>
