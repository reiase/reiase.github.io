<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">沙箱内最小静态 Server 的整机架构</title>
  <desc id="desc">展示训练 worker 通过 SDK 访问沙箱边界内的最小静态 server，再由 server 提供命令执行、文件访问和观测原语。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#dbe4ff;stroke-width:2;filter:url(#shadow)}.boundary{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;stroke-dasharray:10 8}.server{fill:#eef2ff;stroke:#818cf8;stroke-width:2;filter:url(#shadow)}.tool{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.text{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.arrow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow)}.thin{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1080" height="600" rx="28"/>
  <text class="title" x="52" y="58">沙箱内部只保留最小稳定的控制 Server</text>
  <text class="text" x="52" y="88">外部训练系统通过 API 请求控制沙箱，沙箱内 Go/Rust 静态 server 只提供最小执行原语。</text>
  <rect class="box" x="54" y="210" width="210" height="120" rx="18"/><text class="label" x="93" y="254">Rollout Worker</text><text class="small" x="90" y="284">模型采样 / action 生成</text><text class="small" x="90" y="308">接收 observation / reward</text>
  <rect class="box" x="324" y="210" width="190" height="120" rx="18"/><text class="label" x="365" y="254">SDK / API</text><text class="small" x="354" y="284">RPC / HTTP</text><text class="small" x="354" y="308">生命周期与调用协议</text>
  <rect class="boundary" x="584" y="132" width="430" height="348" rx="24"/><text class="label" x="620" y="170">Container / VM Boundary</text><text class="small" x="620" y="194">隔离文件系统、网络、进程与资源</text>
  <rect class="server" x="676" y="234" width="246" height="112" rx="18"/><text class="label" x="706" y="278">Minimal Static Server</text><text class="small" x="704" y="308">Go / Rust，全静态链接</text><text class="small" x="704" y="330">exec / file / env / metrics</text>
  <rect class="tool" x="620" y="396" width="120" height="54" rx="14"/><text class="small" x="651" y="428">Shell</text>
  <rect class="tool" x="756" y="396" width="120" height="54" rx="14"/><text class="small" x="783" y="428">File System</text>
  <rect class="tool" x="892" y="396" width="86" height="54" rx="14"/><text class="small" x="908" y="428">Verifier</text>
  <rect class="tool" x="620" y="64" width="160" height="48" rx="14"/><text class="small" x="654" y="94">Browser / GUI</text>
  <rect class="tool" x="814" y="64" width="164" height="48" rx="14"/><text class="small" x="846" y="94">Task Packages</text>
  <path class="arrow" d="M264 270 L318 270"/><path class="arrow" d="M514 270 L670 288"/><path class="thin" d="M799 234 L714 116"/><path class="thin" d="M824 234 L882 116"/><path class="thin" d="M742 346 L688 392"/><path class="thin" d="M800 346 L814 392"/><path class="thin" d="M862 346 L926 392"/>
  <path class="arrow" d="M676 322 C560 390 382 354 262 310"/>
  <text class="small" x="372" y="380">结果、日志、reward 回传</text>
</svg>
