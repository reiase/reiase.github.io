<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="684" viewBox="0 0 1000 684" role="img" aria-labelledby="title desc"><title id="title">Guest 内核放在哪里</title><desc id="desc">直接 microVM、ArcBox 嵌套 Firecracker、Sandstorm gVisor 后端的不同隔离路径。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617186"/></marker></defs>
<rect x="0" y="0" width="1000" height="684" rx="0" fill="#f8fafc"/>
<text x="26" y="43" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="29" font-weight="600" fill="#192739">Guest 内核究竟放在哪里？</text>
<text x="26" y="77" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">选择具体执行路径后，才能比较隔离与资源开销</text>
<rect x="24" y="102" width="296" height="548" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="40" y="138" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#192739">直接运行 microVM</text>
<rect x="352" y="102" width="296" height="548" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="368" y="138" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#192739">ArcBox Agent sandbox</text>
<rect x="680" y="102" width="296" height="548" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="696" y="138" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="22" font-weight="600" fill="#192739">Sandstorm / gVisor</text>
<rect x="40" y="166" width="264" height="75" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="56" y="195" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">Agent / 应用</text>
<line x1="172" y1="241" x2="172" y2="270" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="272" width="264" height="90" rx="7" fill="#eef3fc" stroke="#d7e0e9"/>
<text x="56" y="301" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#4266ad">Guest Linux 内核</text>
<text x="56" y="330" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">任务自己的内核</text>
<line x1="172" y1="362" x2="172" y2="391" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="393" width="264" height="90" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="56" y="422" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">VMM + 虚拟设备</text>
<text x="56" y="451" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">由宿主虚拟化接口运行</text>
<line x1="172" y1="483" x2="172" y2="512" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="514" width="264" height="76" rx="7" fill="#e9eef4" stroke="#d7e0e9"/>
<text x="56" y="543" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">宿主系统</text>
<text x="56" y="572" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">KVM / WHP / HVF 等</text>
<text x="40" y="622" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" font-weight="400" fill="#617186">如 NVX、smolvm、pVisor VM</text>
<rect x="368" y="166" width="264" height="75" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="384" y="195" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">Agent / 应用</text>
<line x1="500" y1="241" x2="500" y2="270" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="368" y="272" width="264" height="90" rx="7" fill="#eef3fc" stroke="#d7e0e9"/>
<text x="384" y="301" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#4266ad">内层 Guest Linux</text>
<text x="384" y="330" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">每个 sandbox 独立</text>
<line x1="500" y1="362" x2="500" y2="391" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="368" y="393" width="264" height="90" rx="7" fill="#edf7f1" stroke="#d7e0e9"/>
<text x="384" y="422" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#27745b">Firecracker / KVM</text>
<text x="384" y="451" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">位于外层 Linux System VM</text>
<line x1="500" y1="483" x2="500" y2="512" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="368" y="514" width="264" height="76" rx="7" fill="#e9eef4" stroke="#d7e0e9"/>
<text x="384" y="543" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">macOS / VZ</text>
<text x="384" y="572" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">再运行外层 Linux 内核</text>
<text x="368" y="622" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" font-weight="400" fill="#617186">M3+ / macOS 15+ / 嵌套虚拟化</text>
<rect x="696" y="166" width="264" height="75" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="712" y="195" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">应用 / Linux 用户空间</text>
<line x1="828" y1="241" x2="828" y2="270" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="272" width="264" height="90" rx="7" fill="#fff5eb" stroke="#d7e0e9"/>
<text x="712" y="301" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#ad683c">gVisor Sentry</text>
<text x="712" y="330" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">用户态系统调用实现</text>
<line x1="828" y1="362" x2="828" y2="391" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="393" width="264" height="90" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="712" y="422" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">受限的宿主系统调用</text>
<text x="712" y="451" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">由 runsc 隔离与管理</text>
<line x1="828" y1="483" x2="828" y2="512" stroke="#617186" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="514" width="264" height="76" rx="7" fill="#e9eef4" stroke="#d7e0e9"/>
<text x="712" y="543" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">宿主 Linux 内核</text>
<text x="712" y="572" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">此路径不要求 KVM</text>
<text x="696" y="622" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" font-weight="400" fill="#617186">没有额外的 Guest Linux 内核</text>
</svg>