<text x="40" y="189" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="22" font-weight="400" fill="#b84f55">−</text>
<text x="63" y="189" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#b84f55">return text.lower().replace(&quot; &quot;, &quot;-&quot;)</text>
<text x="40" y="238" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="22" font-weight="400" fill="#27745b">+</text>
<text x="63" y="238" text-anchor="start" font-family="DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#27745b">return &quot;-&quot;.join(text.lower().split())</text>
