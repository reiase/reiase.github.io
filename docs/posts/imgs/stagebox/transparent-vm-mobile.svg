<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1134" viewBox="0 0 480 1134" role="img" aria-labelledby="title desc"><title id="title">透明 VM 的分层架构</title><desc id="desc">Guest 内核、虚拟设备、宿主文件服务和网络出口的竖版结构。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617186"/></marker></defs>
