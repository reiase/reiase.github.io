<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="649" viewBox="0 0 1000 649" role="img" aria-labelledby="title desc"><title id="title">网络从 Guest 到宿主出口</title><desc id="desc">两个 TCP 连接通过 OverlayNet 桥接，域名映射和授权在宿主连接之前执行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617186"/></marker></defs>
<rect x="0" y="0" width="1000" height="649" rx="0" fill="#f8fafc"/>
<text x="26" y="42" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="28" font-weight="600" fill="#192739">连接复用宿主出口，TCP 状态仍分别维护</text>
<rect x="28" y="82" width="944" height="78" rx="7" fill="#f1f4fa" stroke="#d7e0e9"/>
<text x="46" y="113" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="22" font-weight="400" fill="#4266ad">合成 DNS：api.example.com ↔ 198.18.x.x</text>
<text x="46" y="143" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">名称映射按 Attempt 保存；收到 SYN 后恢复逻辑目的地。</text>
<rect x="28" y="208" width="260" height="139" rx="7" fill="#eef3fc" stroke="#d7e0e9"/>
<text x="44" y="237" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#4266ad">Guest Linux</text>
<text x="44" y="266" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">应用 socket / TCP/IP</text>
<text x="44" y="293" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">virtio-net 发出 Ethernet 帧</text>
<text x="44" y="320" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">Guest SYN 暂停等待</text>
<rect x="359" y="208" width="282" height="139" rx="7" fill="#fff5eb" stroke="#d7e0e9"/>
<text x="375" y="237" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#ad683c">OverlayNet</text>
<text x="375" y="266" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">virtio-net 后端 → UnixStream</text>
<text x="375" y="293" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">smoltcp 接收 Guest 侧 TCP</text>
<text x="375" y="320" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">域名 / 地址 / 端口 / 任务策略</text>
<rect x="712" y="208" width="260" height="139" rx="7" fill="#edf7f1" stroke="#d7e0e9"/>
<text x="728" y="237" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#27745b">宿主 TCP 出口</text>
<text x="728" y="266" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">授权后创建 upstream socket</text>
<text x="728" y="293" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">使用 host connector / 网络</text>
<text x="728" y="320" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">连接成功后继续 Guest 握手</text>
<line x1="288" y1="267" x2="359" y2="267" stroke="#4266ad" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="641" y1="267" x2="712" y2="267" stroke="#ad683c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="326" y="188" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" font-weight="400" fill="#617186">帧</text>
<text x="677" y="188" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" font-weight="400" fill="#ad683c">授权</text>
<line x1="158" y1="384" x2="500" y2="384" stroke="#4266ad" stroke-width="4"/>
<text x="329" y="418" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="400" fill="#4266ad">Guest ↔ smoltcp 的 TCP</text>
<line x1="500" y1="384" x2="842" y2="384" stroke="#27745b" stroke-width="4"/>
<text x="671" y="418" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="400" fill="#27745b">宿主 ↔ 远端的 TCP</text>
<circle cx="500" cy="384" r="7" fill="#ad683c"/>
<text x="500" y="455" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="20" font-weight="400" fill="#617186">缓冲、背压和关闭分别管理，数据面在中间转发字节</text>
<line x1="55" y1="504" x2="945" y2="504" stroke="#617186" stroke-width="2" stroke-dasharray="7 5"/>
<text x="500" y="535" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="400" fill="#617186">普通 HTTPS：TLS 内容由 Guest 应用与远端处理</text>
<rect x="28" y="564" width="944" height="58" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="46" y="601" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="20" font-weight="400" fill="#192739">当前覆盖：合成 DNS + IPv4 TCP。通用 UDP / IPv6 / QUIC 等失败关闭。</text>
</svg>