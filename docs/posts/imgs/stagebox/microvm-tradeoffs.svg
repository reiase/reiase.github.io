<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="622" viewBox="0 0 1000 622" role="img" aria-labelledby="title desc"><title id="title">保存执行分支与接收文件修改</title><desc id="desc">左侧从保存的 VM 状态继续执行；右侧把 Agent 候选 C 与用户当前 B 比较，发现共同原像 A 已变化，报告冲突。两种机制可以组合。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#617186"/></marker></defs>
<rect x="0" y="0" width="1000" height="622" rx="0" fill="#f8fafc"/>
<text x="28" y="44" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="28" font-weight="600" fill="#192739">从同一个起点出发，接下来要保留什么？</text>
<rect x="24" y="74" width="460" height="518" rx="7" fill="#eef3fc" stroke="#b6c8e4"/>
<rect x="516" y="74" width="460" height="518" rx="7" fill="#edf7f1" stroke="#b7d8c7"/>
<text x="46" y="111" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="24" font-weight="600" fill="#4266ad">保存状态，继续尝试</text>
<text x="538" y="111" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="24" font-weight="600" fill="#27745b">留下修改，接回原项目</text>
<text x="46" y="146" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">快照 / fork：执行状态形成分支</text>
<text x="538" y="146" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">Stagebox：候选结果等待 Apply</text>
<rect x="134" y="175" width="240" height="87" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="150" y="204" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#4266ad">保存的 VM 状态</text>
<text x="150" y="233" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">进程 / 内存 / 私有磁盘</text>
<path d="M 254 262 L 254 299 L 140 299 L 140 337" fill="none" stroke="#4266ad" stroke-width="2"/>
<path d="M 254 299 L 370 299 L 370 337" fill="none" stroke="#4266ad" stroke-width="2"/>
<circle cx="254" cy="299" r="5" fill="#4266ad"/>
<rect x="46" y="338" width="192" height="106" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="62" y="367" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#4266ad">尝试一</text>
<text x="62" y="396" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">从保存状态继续</text>
<text x="62" y="423" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">形成自己的修改</text>
<rect x="272" y="338" width="190" height="106" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="288" y="367" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#4266ad">尝试二</text>
<text x="288" y="396" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">从保存状态继续</text>
<text x="288" y="423" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">形成自己的修改</text>
<text x="46" y="494" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="20" font-weight="400" fill="#4266ad">适合保留现场、并行探索和恢复执行</text>
<text x="46" y="538" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">每个分支有自己的后续状态。</text>
<text x="46" y="568" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">如何接回项目，仍需工作流安排。</text>
<rect x="654" y="175" width="184" height="87" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="670" y="204" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#27745b">原文件 A</text>
<text x="670" y="233" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">Agent 已读取</text>
<path d="M 746 262 L 746 299 L 632 299 L 632 337" fill="none" stroke="#27745b" stroke-width="2"/>
<path d="M 746 299 L 862 299 L 862 337" fill="none" stroke="#27745b" stroke-width="2"/>
<circle cx="746" cy="299" r="5" fill="#27745b"/>
<rect x="538" y="338" width="190" height="106" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="554" y="367" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#192739">用户改成 B</text>
<text x="554" y="396" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">仍在原项目中</text>
<text x="554" y="423" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">继续自己的工作</text>
<rect x="768" y="338" width="186" height="106" rx="7" fill="#fff" stroke="#d7e0e9"/>
<text x="784" y="367" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#27745b">Agent 写出 C</text>
<text x="784" y="396" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">留在私有 upper</text>
<text x="784" y="423" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="18" font-weight="400" fill="#617186">等待检查与接收</text>
<line x1="768" y1="393" x2="729" y2="393" stroke="#ad683c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="746" y="324" text-anchor="middle" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="17" font-weight="400" fill="#ad683c">Apply</text>
<text x="538" y="494" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="21" font-weight="600" fill="#ad683c">原像 A ≠ 当前 B → 报告冲突</text>
<text x="538" y="538" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">不能直接用 C 覆盖 B。</text>
<text x="538" y="568" text-anchor="start" font-family="Noto Sans CJK SC,Noto Sans SC,sans-serif" font-size="19" font-weight="400" fill="#617186">恢复 VM 也不会自动合并两个版本。</text>
</svg>